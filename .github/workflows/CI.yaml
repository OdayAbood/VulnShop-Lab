name: CI
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    build-and-test:
        name: ${{matrix.app}}
        runs-on: ubuntu-latest
        strategy:
            #If one of them failed the other will not fail.
            fail-fast: false
            matrix:
                app: [backend, frontend]
        defaults:
            run:
                working-directory: ${{matrix.app}}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                node-version: 24
                cache: npm
                cache-dependency-path: ${{matrix.app}}/package-lock.json
            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              # With the condition if it will run on the both runners [frontend, backend]
              run: npm run build

            - name: Test
              run: npm test
    secrets-scan:
        name: GitLeaks  
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                #0 it will take the whole hoist but 1 will take the last commit only
                fetch-depth: 0
            - uses: gitleaks/gitleaks-action@v3
              env:
                GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
