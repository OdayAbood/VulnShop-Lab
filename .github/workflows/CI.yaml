name: CI
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    build-and-test:
        name: ${{matrix.app}}
        runs-on: ubuntu-latest
        strategy:
            #If one of them failed the other will fail too.
            fail-fast: false
            matrix:
                app: [backend, frontend]
        defaults:
            run:
                working-directory: ${{matrix.app}}
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                node-version: 24
                cache: npm
                cache-dependency-path: ${{matrix.app}}/package-lock.json
            - name: Install dependencies
              run: npm ci
